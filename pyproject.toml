[project]
name = "nova-assistant"
version = "0.0.0"
description = "Nova 个人 AI 助手：后端基础架构"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "starlette>=0.40,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "httpx2>=2,<3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6,<0.14"

[tool.uv.build-backend]
module-name = "nova"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "benchmarks/model_benchmark/tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

